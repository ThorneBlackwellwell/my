<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการโพสต์</title>
  <link rel="stylesheet" href="css/a1-2.css" />
  <link rel="stylesheet" href="css/manage-post.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
</head>
<body>

  <div class="navbar">
    <div class="logo"><a href="a5.html" class="mm">DR Frash Plus SMC</a></div>
    <ul class="links">
      <li><a class="gt" href="a1.html">กิจกรรม</a></li>
      <li><a class="gt" href="a2.html">สินค้า</a></li>
      <li><a class="gt" href="a3.html">การตลาด</a></li>
      <li><a class="gt" href="a4.html">รีวิว</a></li>
    </ul>
    <a href="a6.html" class="action_btn">ติดต่อเรา</a>
    <div class="toggle_btn">
      <i class="fa-solid fa-bars"></i>
    </div>
  </div>

  <div class="dropdown_menu">
    <li><a class="gt" href="a1.html">กิจกรรม</a></li>
    <li><a class="gt" href="a2.html">สินค้า</a></li>
    <li><a class="gt" href="a3.html">การตลาด</a></li>
    <li><a class="gt" href="a4.html">รีวิว</a></li>
    <li><a href="a6.html" class="action_btn">ติดต่อเรา</a></li>
  </div>

  <div class="manage-container">
    <h2>สร้างโพสต์ใหม่</h2>
    <form id="postForm">
      <input type="text" id="title" placeholder="หัวข้อโพสต์" required />
      <textarea id="body" placeholder="เนื้อหาโพสต์" required></textarea>
      <input type="file" id="imageInput" accept="image/*" required />
      <button type="submit">เพิ่มโพสต์</button>
    </form>

    <h2>รายการโพสต์</h2>
    <input type="text" id="searchManage" placeholder="ค้นหาโพสต์..." />
    <div id="postListManage" class="post-list"></div>
  </div>

  <script>
    const form = document.getElementById("postForm");
    const titleInput = document.getElementById("title");
    const bodyInput = document.getElementById("body");
    const imageInput = document.getElementById("imageInput");
    const postListManage = document.getElementById("postListManage");
    const searchInput = document.getElementById("searchManage");

    function loadPosts() {
      const posts = JSON.parse(localStorage.getItem("posts")) || [];
      return posts;
    }

    function savePosts(posts) {
      localStorage.setItem("posts", JSON.stringify(posts));
    }

    function renderPosts(filter = "") {
      const posts = loadPosts();
      const filtered = posts.filter(p =>
        p.title.toLowerCase().includes(filter.toLowerCase()) ||
        p.body.toLowerCase().includes(filter.toLowerCase())
      );

      postListManage.innerHTML = "";
      if (filtered.length === 0) {
        postListManage.innerHTML = "<p style='color:white;'>ไม่พบโพสต์</p>";
        return;
      }

      filtered.forEach((post, index) => {
        const card = document.createElement("div");
        card.className = "post-card";
        card.innerHTML = `
          <img src="${post.image}" class="post-image" />
          <div class="post-content">
            <h3>${post.title}</h3>
            <p>${post.body}</p>
            <button onclick="deletePost(${index})">ลบ</button>
          </div>
        `;
        postListManage.appendChild(card);
      });
    }

    function deletePost(index) {
      const posts = loadPosts();
      posts.splice(index, 1);
      savePosts(posts);
      renderPosts(searchInput.value);
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const reader = new FileReader();
      reader.onload = function () {
        const image = reader.result;
        const newPost = {
          title: titleInput.value,
          body: bodyInput.value,
          image: image,
        };
        const posts = loadPosts();
        posts.unshift(newPost);
        savePosts(posts);
        form.reset();
        renderPosts(searchInput.value);
        alert("เพิ่มโพสต์เรียบร้อย!");
      };
      reader.readAsDataURL(imageInput.files[0]);
    });

    searchInput.addEventListener("input", () => {
      renderPosts(searchInput.value);
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderPosts();
    });

    document.querySelector('.toggle_btn').addEventListener('click', () => {
      document.querySelector('.dropdown_menu').classList.toggle('open');
    });
  </script>

</body>
</html>
